name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['VERSION', 'desktop/**', 'scripts/gen_icons.py', '.github/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: ./.github/actions/build-windows

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vega-win
          path: |
            desktop/dist/VEGA-*.exe
            desktop/dist/VEGA-*.zip
            desktop/dist/VEGA-*.blockmap