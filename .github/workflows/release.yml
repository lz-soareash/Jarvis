name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: ./.github/actions/build-windows
        with:
          stage-dir: release-artifacts

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-artifacts/
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      VEGA_KEYSTORE_BASE64: ${{ secrets.VEGA_KEYSTORE_BASE64 }}
      VEGA_KEYSTORE_PASSWORD: ${{ secrets.VEGA_KEYSTORE_PASSWORD }}
      VEGA_KEYSTORE_KEY_ALIAS: ${{ secrets.VEGA_KEYSTORE_KEY_ALIAS }}
      VEGA_KEYSTORE_KEY_PASSWORD: ${{ secrets.VEGA_KEYSTORE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: ./.github/actions/build-android
        with:
          staging: release-artifacts

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-artifacts/
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts/merged

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: flatten + checksums
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts/merged
          find . -mindepth 2 -type f -name 'VEGA-*' -exec mv -f {} . \;
          rm -rf release-windows release-android
          VERSION=$(cat ../../VERSION)
          python ../../scripts/release_checksums.py --version "$VERSION" --out SHA256SUMS.txt VEGA-*.apk VEGA-*.exe VEGA-*.zip
          sha256sum -c SHA256SUMS.txt
          ls -la .
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: VEGA v${{ steps.meta.outputs.version }}
          overwrite: true
          generate_release_notes: false
          body: |
            # VEGA v${{ steps.meta.outputs.version }}

            Primeira versão distribuível do VEGA — **UMA IA, MÚLTIPLOS CLIENTES**.

            ## Windows

            - `VEGA-${{ steps.meta.outputs.version }}-win-x64.exe` — instalador (NSIS, 64 bits)
            - `VEGA-${{ steps.meta.outputs.version }}-win-x64-portable.exe` — versão portátil (sem instalação)
            - `VEGA-${{ steps.meta.outputs.version }}-win-x64-portable.zip` — pasta portátil compactada

            ## Android

            - `VEGA-${{ steps.meta.outputs.version }}-android.apk` — aplicativo Android (APK assinado)

            ## Checksums

            - `SHA256SUMS.txt` — soma de verificação de todos os artefatos acima

            ## Destaques

            - Cliente Desktop Windows (Electron 31) e cliente Android (Kotlin + Compose) como **clientes finos** — toda a inteligência vive no Core local (`http://127.0.0.1:8100`)
            - Device Bridge (Registro/Pareamento/Heartbeat) com `device_id` emitido pelo servidor
            - Identidade e presença VEGA, Computer Action/Use foundation e Proactive (planejado/limitado)
            - Distribuição automatizada e reproduzível via GitHub Actions (Fase 22)

            ### Notas de assinatura

            - Artefatos Windows **não** são assinados com Authenticode (sem certificado de code-signing); verifique via `SHA256SUMS.txt`.
            - APK Android assinado (v2). Se as secrets `VEGA_KEYSTORE_*` não estiverem configuradas, a assinatura usa um **keystore efêmero self-signed gerado no CI** (certificado VEGA/CI); para chave oficial estável, configure `VEGA_KEYSTORE_BASE64`/`VEGA_KEYSTORE_PASSWORD`/`VEGA_KEYSTORE_KEY_ALIAS`/`VEGA_KEYSTORE_KEY_PASSWORD` como GitHub Secrets e reexecute a release.
          files: |
            release-artifacts/merged/VEGA-*.apk
            release-artifacts/merged/VEGA-*.exe
            release-artifacts/merged/VEGA-*.zip
            release-artifacts/merged/SHA256SUMS.txt