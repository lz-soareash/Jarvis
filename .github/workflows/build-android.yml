name: build-android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['VERSION', 'android/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VEGA_KEYSTORE_BASE64: ${{ secrets.VEGA_KEYSTORE_BASE64 }}
      VEGA_KEYSTORE_PASSWORD: ${{ secrets.VEGA_KEYSTORE_PASSWORD }}
      VEGA_KEYSTORE_KEY_ALIAS: ${{ secrets.VEGA_KEYSTORE_KEY_ALIAS }}
      VEGA_KEYSTORE_KEY_PASSWORD: ${{ secrets.VEGA_KEYSTORE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: build APK
        working-directory: android
        shell: bash
        run: |
          VERSION=$(cat ../VERSION)
          mkdir -p ../releases-staging
          if [ -n "$VEGA_KEYSTORE_BASE64" ]; then
            ./gradlew :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../releases-staging/VEGA-${VERSION}-android.apk"
          else
            ./gradlew :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../releases-staging/VEGA-${VERSION}-android-debug.apk"
          fi

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vega-android
          path: releases-staging/
          if-no-files-found: error