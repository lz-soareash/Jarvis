name: Build, validate and stage Android APK
description: |-
  Fase 27.2 (F10/F11): roda os unit tests (testDebugUnitTest+testReleaseUnitTest)
  e compila app-release.apk. Assinatura oficial via secrets VEGA_KEYSTORE_*;
  quando `require-official-signing=true` e as secrets estiverem ausentes o job
  FALHA imediatamente (nunca publica APK com keystore efêmero self-signed — a
  assinatura efêmera impede atualizações compatíveis e não fornece uma
  identidade de assinatura estável; o Google Play Protect pode sinalizar
  sideloads sem histórico). Com `false` (CI/preview) usa keystore efêmero
  gerado no job e nunca persistido. Valida o APK (aapt2 + apksigner) e o copia
  para o staging. Nenhuma chave/password sai do job ou entra no Git.
inputs:
  staging:
    description: "Diretório destino do APK (ex.: releases-staging). Obrigatório."
    required: true
  require-official-signing:
    description: "true → falha se as secrets VEGA_KEYSTORE_* não estiverem presentes (release público)."
    required: false
    default: "false"
  run-tests:
    description: "true → executa os unit tests do Android antes do assembleRelease."
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: gradle cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('android/app/build.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}

    - name: unit tests
      working-directory: android
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ inputs.run-tests }}" = "true" ]; then
          echo "== unit tests (debug + release) =="
          ./gradlew :app:testDebugUnitTest :app:testReleaseUnitTest
        fi

    - name: build APK
      working-directory: android
      shell: bash
      run: |
        set -euo pipefail
        chmod +x gradlew
        VERSION=$(cat ../VERSION)
        if [ -n "${VEGA_KEYSTORE_BASE64:-}" ]; then
          echo "Assinatura oficial: usando secrets VEGA_KEYSTORE_*."
          ./gradlew :app:assembleRelease
        elif [ "${{ inputs.require-official-signing }}" = "true" ]; then
          echo "::error::Assinatura oficial obrigatória para release público — configure as secrets VEGA_KEYSTORE_BASE64, VEGA_KEYSTORE_PASSWORD, VEGA_KEYSTORE_KEY_ALIAS e VEGA_KEYSTORE_KEY_PASSWORD (Fase 27.2 F10)."
          exit 1
        else
          echo "Secrets ausentes e release NÃO exige assinatura oficial: gerando keystore efêmero de CI (self-signed VEGA) apenas para este job."
          CI_KEYSTORE_PASS=$(openssl rand -hex 16)
          mkdir -p app/keystore
          keytool -genkeypair -v -keystore app/keystore/ci-release.jks -alias vega-release \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "$CI_KEYSTORE_PASS" -keypass "$CI_KEYSTORE_PASS" \
            -dname "CN=VEGA, OU=CI Self-Signed, O=JARVIS, C=BR" >/dev/null 2>&1
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=vega-release\nstoreFile=keystore/ci-release.jks\n' \
            "$CI_KEYSTORE_PASS" "$CI_KEYSTORE_PASS" > keystore.properties
          ./gradlew :app:assembleRelease
          rm -rf app/keystore keystore.properties
        fi
        APK=app/build/outputs/apk/release/app-release.apk
        test -s "$APK" || { echo "FALTA APK: $APK"; exit 1; }

    - name: validate APK
      working-directory: android
      shell: bash
      run: |
        set -euo pipefail
        APK=app/build/outputs/apk/release/app-release.apk
        BT=$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
        echo "== aapt2 badging =="
        "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^application-label:|^launchable-activity" | head -n 5
        echo "== apksigner =="
        "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -E "Verified using|Signer #1 certificate DN" | head -n 8

    - name: stage APK
      working-directory: android
      shell: bash
      run: |
        set -euo pipefail
        VERSION=$(cat ../VERSION)
        mkdir -p "$GITHUB_WORKSPACE/${{ inputs.staging }}"
        cp app/build/outputs/apk/release/app-release.apk \
          "$GITHUB_WORKSPACE/${{ inputs.staging }}/VEGA-${VERSION}-android.apk"
        ls -la "$GITHUB_WORKSPACE/${{ inputs.staging }}/"